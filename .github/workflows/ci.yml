name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  windows:
    permissions:
      contents: write
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: python scripts/package-windows.py
      - run: python scripts/test-camera-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Virtual-ATEM-windows-x64
          path: |
            dist/Virtual-ATEM-*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/camera-preview.png
          if-no-files-found: error
      - name: Publish Windows prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version must match" }
          gh release create "$env:GITHUB_REF_NAME" "dist/Virtual-ATEM-$version-windows-x64.zip" "dist/SHA256SUMS.txt" "dist/camera-preview.png" --verify-tag --prerelease --title "Virtual ATEM $env:GITHUB_REF_NAME - Windows x64" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record successful publication for Git-only clients
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $existing = git ls-remote origin refs/notes/releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            git fetch origin refs/notes/releases:refs/notes/releases
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git notes --ref=releases add -f -m "Published https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME with Windows ZIP and SHA256SUMS.txt" HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin refs/notes/releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
